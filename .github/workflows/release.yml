# =============================================================
# Workflow: CD - Phát hành Docker Image lên GHCR theo Git Tag
# Kích hoạt: khi push tag có dạng v*.*.*  (ví dụ: v1.0.0)
# Image được đẩy lên: ghcr.io/<owner>/<repo>:<tag>
# =============================================================

name: CD - Release Docker Image

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  release-image:
    name: Build & Push Docker Image to GHCR
    runs-on: ubuntu-latest

    # Cấp quyền ghi vào GitHub Packages (GHCR)
    permissions:
      contents: read
      packages: write

    steps:
      # ----------------------------------------------------------
      # Bước 1: Checkout mã nguồn từ repository
      # ----------------------------------------------------------
      - name: Checkout mã nguồn
        uses: actions/checkout@v5

      # ----------------------------------------------------------
      # Bước 2: Đăng nhập vào GitHub Container Registry (GHCR)
      # ----------------------------------------------------------
      - name: Đăng nhập vào GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ----------------------------------------------------------
      # Bước 3: Trích xuất metadata (tag, label) từ Git Tag
      #   - tags: tạo tag image dạng ghcr.io/<owner>/<repo>:v1.0.0
      #           và ghcr.io/<owner>/<repo>:latest
      #   - labels: gắn OCI labels chuẩn vào image
      # ----------------------------------------------------------
      - name: Trích xuất Docker metadata từ Git Tag
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest,enable={{is_default_branch}}

      # ----------------------------------------------------------
      # Bước 4: Thiết lập Docker Buildx (builder nâng cao)
      # ----------------------------------------------------------
      - name: Thiết lập Docker Buildx
        uses: docker/setup-buildx-action@v3

      # ----------------------------------------------------------
      # Bước 5: Đóng gói và Push Docker Image lên GHCR
      # ----------------------------------------------------------
      - name: Build và Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
